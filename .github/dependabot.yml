version: 2
updates:
  - package-ecosystem: "npm"
    directory: "/"
    schedule:
      interval: "weekly"
      day: "monday"
      time: "09:00"
      timezone: "UTC"
    open-pull-requests-limit: 10
    groups:
      web3:
        patterns:
          - "viem"
          - "wagmi"
          - "@wagmi/*"
          - "ethers"
          - "@safe-global/*"
          - "@walletconnect/*"
          - "@coinbase/wallet-sdk"
          - "@metamask/sdk"
      ui:
        patterns:
          - "@radix-ui/*"
          - "lucide-react"
          - "framer-motion"
          - "class-variance-authority"
          - "tailwind-merge"
          - "clsx"
          - "cmdk"
          - "vaul"
          - "sonner"
      infra:
        patterns:
          - "next"
          - "react"
          - "react-dom"
          - "@types/react"
          - "@types/react-dom"
          - "typescript"
          - "eslint"
          - "@typescript-eslint/*"
          - "eslint-config-next"
          - "zustand"
    labels:
      - "dependencies"
      - "Stellar Wave"
    reviewers:
      - "oladev2026-tech"
