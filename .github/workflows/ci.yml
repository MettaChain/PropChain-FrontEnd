name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint-and-typecheck:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 20

      - name: Install dependencies
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: Typecheck
        run: npm run typecheck

  test:
    runs-on: ubuntu-latest
    services:
      redis:
        image: redis:7-alpine
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
        ports:
          - 6379:6379

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 20

      - name: Install dependencies
        run: npm ci

      # The service healthcheck above already gates job start, but keep an
      # explicit probe using a deterministic container lookup (published port,
      # then service name) instead of matching on the runner's image ancestry,
      # which could select the wrong container after a runner image change.
      - name: Wait for Redis
        run: |
          set -euo pipefail
          for i in $(seq 1 30); do
            container_id="$(docker ps -q --filter 'publish=6379' | head -n1)"
            if [ -z "$container_id" ]; then
              container_id="$(docker ps -q --filter 'name=redis' | head -n1)"
            fi
            if [ -n "$container_id" ] && docker exec "$container_id" redis-cli ping 2>/dev/null | grep -q PONG; then
              echo "Redis is ready (container ${container_id})."
              exit 0
            fi
            echo "Waiting for Redis... (${i}/30, container=${container_id:-none})"
            sleep 2
          done
          echo "::error::Redis did not respond to PING within 60s."
          echo "--- docker ps -a ---"
          docker ps -a
          echo "--- container logs ---"
          docker logs "${container_id:-$(docker ps -aq | head -n1)}" 2>&1 | tail -n 50 || true
          exit 1

      # json-summary is what scripts/write-coverage-summary.mjs renders into the
      # job summary below; text-summary keeps the raw numbers in the log.
      - name: Run tests
        env:
          REDIS_HOST: localhost
          REDIS_PORT: 6379
        run: npm run test:ci -- --coverageReporters=json-summary --coverageReporters=text-summary

      - name: Publish coverage summary to job summary
        if: always()
        run: npm run coverage:summary

      # Uploaded rather than committed: a coverage report in the working tree
      # is noise in review and goes stale within a commit (#1097).
      - name: Upload coverage artifact
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: coverage
          path: coverage/
          retention-days: 14
          if-no-files-found: warn

  cypress-component:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 20

      - name: Install dependencies
        run: npm ci

      - name: Run Cypress component tests
        run: npm run test:cy:component

  build:
    runs-on: ubuntu-latest
    needs: [lint-and-typecheck, test]
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 20

      - name: Install dependencies
        run: npm ci

      - name: Build
        run: npx next build

  e2e:
    runs-on: ubuntu-latest
    needs: [build]
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 20

      - name: Install dependencies
        run: npm ci

      - name: Install Playwright browsers
        run: npx playwright install --with-deps chromium

      - name: Build
        run: npx next build

      # Also runs tests/e2e/accessibility.spec.ts (axe checks).
      - name: Run Playwright e2e tests
        run: npx playwright test

      # No baseline screenshots are committed yet, so a first run has
      # nothing to diff against; keep this advisory until baselines exist.
      - name: Run visual regression tests
        continue-on-error: true
        run: npx playwright test --config=playwright.visual.config.ts

      - name: Upload Playwright report
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: playwright-report
          path: playwright-report/
          retention-days: 14
          if-no-files-found: ignore

      # Traces, screenshots and videos for failed specs, plus the junit/json
      # reporter output. These used to be committed into test-results/ (#1097).
      - name: Upload Playwright test results
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: playwright-test-results
          path: test-results/
          retention-days: 14
          if-no-files-found: ignore

  # Storybook build + story tests (#1096). `test-storybook` runs every story
  # through the a11y addon in a real browser via the Vitest browser provider.
  storybook:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 20

      - name: Install dependencies
        run: npm ci

      - name: Install Playwright browsers
        run: npx playwright install --with-deps chromium

      - name: Build Storybook
        run: npm run build-storybook

      - name: Run story tests (a11y via @storybook/addon-a11y)
        run: npm run test:storybook
