version: '3.8'

services:
  anvil:
    image: ghcr.io/foundry-rs/foundry:latest
    container_name: propchain-anvil-local
    ports:
      - '8545:8545'
    command: >
      anvil
      --host 0.0.0.0
      --port 8545
      --accounts 10
      --balance 100
      --mnemonic "test test test test test test test test test test test junk"
      --block-time 1
      --gas-limit 30000000
      --state-interval 1
    environment:
      - RUST_LOG=info
    volumes:
      - ./anvil_data:/data
    healthcheck:
      test: ['CMD', 'curl', '-f', 'http://localhost:8545']
      interval: 5s
      timeout: 3s
      retries: 5
      start_period: 10s
    networks:
      - propchain

volumes:
  anvil_data:
    driver: local

networks:
  propchain:
    driver: bridge
